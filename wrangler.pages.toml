# Cloudflare Pages — deploy config (oddzielny od Worker bindings)
# Używany przez GitHub Actions workflow: deploy-web.yml
# wrangler pages deploy dist --config wrangler.pages.toml

name = "zeno-browser-web"
pages_build_output_dir = "dist"
compatibility_date = "2026-03-24"
compatibility_flags = ["nodejs_compat"]

[browser]
binding = "BROWSER"
