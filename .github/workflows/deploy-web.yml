name: Deploy Web to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "ai-hub/**"
      - "functions/**"
      - ".github/workflows/deploy-web.yml"
      - "index.html"
      - "vite.config.ts"
      - "wrangler.toml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3 make g++ build-essential

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Build Vite app
        run: npm run build:vite

      - name: Copy ai-hub to dist
        run: cp -r ai-hub dist/ai-hub

      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "❌ CLOUDFLARE_API_TOKEN is not set!"; exit 1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "❌ CLOUDFLARE_ACCOUNT_ID is not set!"; exit 1; fi
          echo "✅ Secrets present"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install Wrangler CLI
        run: npm i -g wrangler@4

      - name: Validate Wrangler configuration
        run: wrangler check

      - name: Deploy to Cloudflare Pages (direct CLI)
        run: |
          wrangler --version
          wrangler pages project list
          wrangler pages deploy dist --project-name=zeno-browser-web --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
