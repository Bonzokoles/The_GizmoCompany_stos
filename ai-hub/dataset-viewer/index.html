<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 Dataset Viewer PL — JIMBO DevZ</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #16161f;
      --border: rgba(255,255,255,0.07);
      --accent: #00ffcc;
      --accent2: #a78bfa;
      --accent3: #fbbf24;
      --danger: #f87171;
      --success: #34d399;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --text-muted: #64748b;
      --glass: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.09);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ─── TOPBAR ─── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: .6rem 1rem;
      background: rgba(10,10,20,0.95);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 100;
    }
    .logo { display: flex; align-items: center; gap: .6rem; font-weight: 700; font-size: 1rem; }
    .logo span { color: var(--accent); }
    .topbar-stats { display: flex; gap: 1rem; margin-left: auto; font-size: .75rem; color: var(--text-dim); }
    .topbar-stats b { color: var(--accent3); }

    /* ─── LAYOUT ─── */
    .layout { display: flex; flex: 1; overflow: hidden; }

    /* ─── SIDEBAR ─── */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-search {
      padding: .6rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-search input {
      width: 100%;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: .4rem;
      padding: .4rem .7rem;
      color: var(--text);
      font-size: .8rem;
      outline: none;
    }
    .sidebar-search input:focus { border-color: var(--accent); }
    .sidebar-list { flex: 1; overflow-y: auto; padding: .4rem; }
    .sidebar-list::-webkit-scrollbar { width: 4px; }
    .sidebar-list::-webkit-scrollbar-track { background: transparent; }
    .sidebar-list::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

    .cat-label {
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      padding: .6rem .4rem .3rem;
      font-weight: 600;
    }
    .ds-item {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .45rem .6rem;
      border-radius: .4rem;
      cursor: pointer;
      font-size: .8rem;
      color: var(--text-dim);
      transition: all .15s;
      position: relative;
    }
    .ds-item:hover { background: var(--glass); color: var(--text); }
    .ds-item.active { background: rgba(0,255,204,0.08); color: var(--accent); border: 1px solid rgba(0,255,204,0.15); }
    .ds-item .ds-icon { font-size: .9rem; flex-shrink: 0; }
    .ds-item .ds-name { flex: 1; line-height: 1.3; }
    .ds-item .ds-badge {
      font-size: .6rem;
      background: rgba(251,191,36,0.15);
      color: var(--accent3);
      padding: .1rem .3rem;
      border-radius: 3px;
      white-space: nowrap;
    }
    .ds-item .ds-translated {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
    }

    /* ─── MAIN ─── */
    .main { flex: 1; overflow-y: auto; padding: 1.5rem; }
    .main::-webkit-scrollbar { width: 6px; }
    .main::-webkit-scrollbar-track { background: transparent; }
    .main::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      color: var(--text-muted);
      gap: 1rem;
      text-align: center;
    }
    .placeholder .big-icon { font-size: 4rem; }
    .placeholder p { font-size: .9rem; max-width: 300px; line-height: 1.6; }

    /* ─── DATASET HEADER ─── */
    .ds-header {
      background: var(--surface);
      border: 1px solid var(--glass-border);
      border-radius: .75rem;
      padding: 1.2rem 1.5rem;
      margin-bottom: 1rem;
    }
    .ds-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: .4rem;
    }
    .ds-meta {
      display: flex;
      gap: .8rem;
      flex-wrap: wrap;
      font-size: .75rem;
      color: var(--text-dim);
      margin-bottom: .7rem;
    }
    .ds-meta span { display: flex; align-items: center; gap: .25rem; }
    .tag {
      display: inline-block;
      background: rgba(167,139,250,0.12);
      color: var(--accent2);
      border: 1px solid rgba(167,139,250,0.2);
      border-radius: .25rem;
      padding: .1rem .4rem;
      font-size: .7rem;
    }
    .cat-pill {
      display: inline-block;
      padding: .2rem .6rem;
      border-radius: 1rem;
      font-size: .72rem;
      font-weight: 600;
    }
    .cat-business { background: rgba(251,191,36,0.15); color: var(--accent3); }
    .cat-analytics { background: rgba(0,255,204,0.12); color: var(--accent); }
    .cat-finanse { background: rgba(52,211,153,0.12); color: var(--success); }
    .cat-ecommerce { background: rgba(167,139,250,0.12); color: var(--accent2); }
    .cat-art { background: rgba(248,113,113,0.12); color: var(--danger); }
    .cat-tech { background: rgba(96,165,250,0.12); color: #60a5fa; }

    /* ─── NAVIGATION ─── */
    .nav-btns {
      display: flex;
      gap: .5rem;
      margin-bottom: 1rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .45rem .9rem;
      border-radius: .4rem;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: var(--text-dim);
      cursor: pointer;
      font-size: .8rem;
      transition: all .15s;
    }
    .btn:hover { background: rgba(255,255,255,0.07); color: var(--text); border-color: rgba(255,255,255,0.15); }
    .btn.primary { background: rgba(0,255,204,0.1); color: var(--accent); border-color: rgba(0,255,204,0.25); }
    .btn.primary:hover { background: rgba(0,255,204,0.18); }
    .btn.purple { background: rgba(167,139,250,0.1); color: var(--accent2); border-color: rgba(167,139,250,0.25); }
    .btn.amber { background: rgba(251,191,36,0.1); color: var(--accent3); border-color: rgba(251,191,36,0.25); }
    .btn.success { background: rgba(52,211,153,0.1); color: var(--success); border-color: rgba(52,211,153,0.25); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-nav-pos { margin-left: auto; font-size: .75rem; color: var(--text-muted); display: flex; align-items: center; }

    /* ─── SOURCES PANEL ─── */
    .sources-panel {
      background: var(--surface);
      border: 1px solid var(--glass-border);
      border-radius: .75rem;
      padding: 1rem 1.2rem;
      margin-bottom: 1rem;
    }
    .panel-title {
      font-size: .8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: .8rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .panel-title .count {
      background: rgba(0,255,204,0.15);
      color: var(--accent);
      border-radius: 1rem;
      padding: .1rem .5rem;
      font-size: .7rem;
      font-weight: 600;
    }
    .sources-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: .5rem;
    }
    .source-item {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: .4rem;
      padding: .5rem .7rem;
      display: flex;
      align-items: flex-start;
      gap: .5rem;
    }
    .source-item .src-icon { font-size: .75rem; margin-top: .1rem; flex-shrink: 0; }
    .source-item .src-body { flex: 1; min-width: 0; }
    .source-item .src-title {
      font-size: .78rem;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: .15rem;
    }
    .source-item .src-url {
      font-size: .68rem;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-decoration: none;
      display: block;
    }
    .source-item .src-url:hover { text-decoration: underline; }
    .source-item .src-score {
      font-size: .65rem;
      color: var(--text-muted);
      flex-shrink: 0;
      align-self: center;
    }
    .toggle-link {
      font-size: .75rem;
      color: var(--accent2);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: .25rem;
      margin-top: .5rem;
    }
    .toggle-link:hover { text-decoration: underline; }

    /* ─── CONTENT PANEL ─── */
    .content-panel {
      background: var(--surface);
      border: 1px solid var(--glass-border);
      border-radius: .75rem;
      padding: 1rem 1.2rem;
      margin-bottom: 1rem;
    }
    .query-block {
      border: 1px solid var(--border);
      border-radius: .5rem;
      padding: .8rem 1rem;
      margin-bottom: .8rem;
      background: var(--glass);
    }
    .query-label {
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: .4rem;
    }
    .query-text {
      font-size: .9rem;
      font-weight: 600;
      color: var(--accent3);
      margin-bottom: .6rem;
    }
    .answer-text {
      font-size: .82rem;
      color: var(--text-dim);
      line-height: 1.65;
    }

    .result-item {
      padding: .6rem .8rem;
      border-left: 2px solid rgba(255,255,255,0.06);
      margin-bottom: .5rem;
      transition: border-color .15s;
    }
    .result-item:hover { border-left-color: var(--accent); }
    .result-item .r-title {
      font-size: .82rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: .2rem;
    }
    .result-item .r-title a { color: inherit; text-decoration: none; }
    .result-item .r-title a:hover { color: var(--accent); text-decoration: underline; }
    .result-item .r-content {
      font-size: .77rem;
      color: var(--text-muted);
      line-height: 1.55;
    }
    .result-item .r-score {
      font-size: .65rem;
      color: var(--success);
      margin-top: .2rem;
    }

    .case-card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: .5rem;
      padding: .9rem 1rem;
      margin-bottom: .7rem;
    }
    .case-company {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: .2rem;
    }
    .case-industry {
      font-size: .75rem;
      color: var(--text-muted);
      margin-bottom: .5rem;
    }
    .case-metrics {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      margin-top: .5rem;
    }
    .metric-badge {
      background: rgba(52,211,153,0.1);
      border: 1px solid rgba(52,211,153,0.2);
      color: var(--success);
      border-radius: .3rem;
      padding: .15rem .5rem;
      font-size: .72rem;
      font-weight: 600;
    }
    .lesson-list {
      list-style: none;
      margin-top: .5rem;
    }
    .lesson-list li {
      font-size: .78rem;
      color: var(--text-dim);
      padding: .15rem 0;
      display: flex;
      gap: .4rem;
    }
    .lesson-list li::before { content: '→'; color: var(--accent2); flex-shrink: 0; }

    .prompt-card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: .4rem;
      padding: .7rem .9rem;
      margin-bottom: .5rem;
      font-size: .8rem;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      line-height: 1.5;
    }

    /* ─── TRANSLATION PANEL ─── */
    .translate-panel {
      background: rgba(167,139,250,0.05);
      border: 1px solid rgba(167,139,250,0.2);
      border-radius: .75rem;
      padding: 1rem 1.2rem;
      margin-bottom: 1rem;
    }
    .translate-panel .panel-title { color: var(--accent2); }
    .translate-controls {
      display: flex;
      gap: .5rem;
      margin-bottom: .8rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .translate-status {
      font-size: .75rem;
      color: var(--text-dim);
      margin-left: auto;
    }
    .translate-output {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: .4rem;
      padding: .8rem 1rem;
      font-size: .82rem;
      line-height: 1.7;
      color: var(--text);
      min-height: 100px;
      white-space: pre-wrap;
    }
    .translate-output.empty { color: var(--text-muted); font-style: italic; }
    .translate-notes {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: .4rem;
      padding: .7rem .9rem;
      font-size: .8rem;
      color: var(--text);
      margin-top: .6rem;
      resize: vertical;
      outline: none;
      font-family: inherit;
      min-height: 80px;
    }
    .translate-notes:focus { border-color: var(--accent2); }
    .translate-saved {
      font-size: .72rem;
      color: var(--success);
      margin-top: .3rem;
      display: none;
    }

    /* ─── PROGRESS BAR ─── */
    .progress-bar {
      background: var(--surface2);
      border-radius: 1rem;
      height: 4px;
      width: 100%;
      overflow: hidden;
      margin-bottom: .5rem;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 1rem;
      transition: width .3s;
    }

    /* ─── SPINNER ─── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent2);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── SCROLLABLE RESULTS ─── */
    .results-limited { max-height: 400px; overflow: hidden; }
    .results-limited.expanded { max-height: none; }

    /* ─── EMPTY STATE ─── */
    .empty-msg {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-muted);
      font-size: .85rem;
    }

    /* ─── SECTION COLLAPSE ─── */
    details summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    details summary::-webkit-details-marker { display: none; }
    details summary::before { content: '▶'; font-size: .65rem; color: var(--text-muted); transition: transform .2s; }
    details[open] summary::before { transform: rotate(90deg); }

    /* ─── CHIP ─── */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: .25rem;
      font-size: .68rem;
      padding: .1rem .4rem;
      border-radius: 1rem;
      background: var(--glass);
      border: 1px solid var(--border);
      color: var(--text-dim);
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

<!-- ─── TOPBAR ─── -->
<div class="topbar">
  <div class="logo">📚 <span>Dataset</span> Viewer PL</div>
  <div class="topbar-stats">
    <span>Datasety: <b id="stat-total">0</b></span>
    <span>Przetłumaczone: <b id="stat-translated">0</b></span>
    <span>Linki źródłowe: <b id="stat-links">—</b></span>
    <span style="color:var(--text-muted)">↑ <a href="../index.html" style="color:var(--accent);text-decoration:none">AI HUB</a></span>
  </div>
</div>

<!-- ─── LAYOUT ─── -->
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-search">
      <input type="text" id="sidebar-search" placeholder="🔍 Szukaj datasetu..." oninput="filterSidebar(this.value)">
    </div>
    <div class="sidebar-list" id="sidebar-list"></div>
  </div>

  <!-- MAIN -->
  <div class="main" id="main">
    <div class="placeholder">
      <div class="big-icon">📚</div>
      <p>Wybierz dataset z listy po lewej, aby zobaczyć jego zawartość, linki źródłowe i możliwość tłumaczenia na język polski.</p>
      <p style="font-size:.78rem;margin-top:.5rem">Dostępne: <b id="ph-total" style="color:var(--accent)">0</b> datasetów</p>
    </div>
  </div>

</div>

function renderSidebar(filter = '') {
  const list = document.getElementById('sidebar-list');
  const cats = {};
  DATASETS.forEach((ds, i) => {
    if (filter && !ds.name.toLowerCase().includes(filter.toLowerCase()) &&
        !ds.desc.toLowerCase().includes(filter.toLowerCase())) return;
    if (!cats[ds.cat]) cats[ds.cat] = [];
    cats[ds.cat].push({ ...ds, idx: i });
  });

  let html = '';
  for (const [cat, items] of Object.entries(cats)) {
    html += `<div class="cat-label">${CAT_LABELS[cat] || cat}</div>`;
    for (const ds of items) {
      const isActive = ds.idx === currentIdx;
      const isTranslated = translatedSet.has(ds.id);
      html += `
        <div class="ds-item${isActive ? ' active' : ''}" onclick="selectDataset(${ds.idx})" title="${ds.desc}">
          <span class="ds-icon">${ds.icon}</span>
          <span class="ds-name">${ds.name}</span>
          ${isTranslated ? '<span class="ds-translated" title="Przetłumaczony"></span>' : ''}
        </div>`;
    }
  }
  list.innerHTML = html || '<div class="empty-msg">Brak wyników</div>';

  // Stats
  document.getElementById('stat-total').textContent = DATASETS.length;
  document.getElementById('stat-translated').textContent = translatedSet.size;
  document.getElementById('ph-total').textContent = DATASETS.length;

async function selectDataset(idx) {
  currentIdx = idx;
  const ds = DATASETS[idx];
  const main = document.getElementById('main');
  main.innerHTML = `<div class="placeholder"><div class="spinner"></div><p style="margin-top:1rem">Ładowanie ${ds.name}…</p></div>`;
  renderSidebar(document.getElementById('sidebar-search').value);

  try {
    const res = await fetch(`../js/data/datasets/${ds.id}.json`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    currentData = await res.json();
    currentSources = extractAllUrls(currentData);
    document.getElementById('stat-links').textContent = currentSources.length;
    renderDataset(ds, currentData, currentSources, idx);
  } catch (e) {
    main.innerHTML = `<div class="placeholder"><div class="big-icon">⚠️</div><p>Nie można załadować: <b>${ds.id}.json</b><br><span style="font-size:.75rem;color:var(--danger)">${e.message}</span></p></div>`;
  }
}

// ═══════════════════════════════════════════════════════
// URL EXTRACTOR — wydobywa wszystkie linki z JSON
// ═══════════════════════════════════════════════════════
function extractAllUrls(obj, collected = []) {
  if (!obj || typeof obj !== 'object') return collected;
  if (Array.isArray(obj)) {
    for (const item of obj) extractAllUrls(item, collected);
    return collected;
  }
  for (const [key, val] of Object.entries(obj)) {
    if ((key === 'url' || key === 'source' || key === 'link' || key === 'href') && typeof val === 'string' && val.startsWith('http')) {
      const title = obj.title || obj.name || obj.company || obj.query || val;
      const score = obj.score || obj.relevance || null;
      const query = obj._query || null;
      if (!collected.find(c => c.url === val)) {
        collected.push({ url: val, title: String(title).slice(0, 120), score, query });
      }
    }
    if (typeof val === 'object') extractAllUrls(val, collected);
  }
  return collected;
}

// ═══════════════════════════════════════════════════════
// CONTENT RENDERER — obsługuje różne typy JSON
// ═══════════════════════════════════════════════════════
function renderContent(data) {
  // raw_searches type
  if (data.raw_searches && Array.isArray(data.raw_searches)) {
    return renderRawSearches(data.raw_searches);
  }
  // case studies
  if (data.case_studies && Array.isArray(data.case_studies)) {
    return renderCaseStudies(data.case_studies);
  }
  // prompts
  if (data.prompts && Array.isArray(data.prompts)) {
    return renderPrompts(data.prompts);
  }
  // generic items/data array
  const arrKey = ['items', 'data', 'articles', 'entries', 'records', 'results', 'tools', 'categories'].find(k => Array.isArray(data[k]));
  if (arrKey) {
    return renderGenericArray(data[arrKey]);
  }
  // research index
  if (data.topics && Array.isArray(data.topics)) {
    return renderResearchIndex(data.topics);
  }
  // fallback — raw JSON preview
  return `<pre style="font-size:.72rem;color:var(--text-muted);overflow:auto;max-height:400px;white-space:pre-wrap">${JSON.stringify(data, null, 2).slice(0, 5000)}${JSON.stringify(data, null, 2).length > 5000 ? '\n…(skrócono)' : ''}</pre>`;
}

function renderRawSearches(searches) {
  if (!searches.length) return '<div class="empty-msg">Brak danych</div>';
  let html = '';
  for (const s of searches) {
    html += `<div class="query-block">
      <div class="query-label">🔍 Zapytanie</div>
      <div class="query-text">${s.query || '—'}</div>
      ${s.answer ? `<div class="answer-text">${s.answer}</div>` : ''}
      ${s.results && s.results.length ? `
        <details style="margin-top:.7rem">
          <summary style="font-size:.75rem;color:var(--accent2);cursor:pointer;padding:.3rem 0">
            📄 ${s.results.length} wyników źródłowych
          </summary>
          <div style="margin-top:.5rem">
            ${s.results.map(r => `
              <div class="result-item">
                <div class="r-title"><a href="${r.url || '#'}" target="_blank" rel="noopener noreferrer">${r.title || r.url}</a></div>
                ${r.content ? `<div class="r-content">${r.content.slice(0, 300)}…</div>` : ''}
                ${r.score ? `<div class="r-score">Trafność: ${(r.score * 100).toFixed(1)}%</div>` : ''}
              </div>`).join('')}
          </div>
        </details>` : ''}
    </div>`;
  }
  return html;
}

function renderCaseStudies(cases) {
  if (!cases.length) return '<div class="empty-msg">Brak danych</div>';
  return cases.map(c => {
    const metrics = c.html_friendly?.metrics_display || c.key_metrics ? Object.values(c.key_metrics || {}) : [];
    const lessons = c.lessons || [];
    return `<div class="case-card">
      <div class="case-company">${c.company || c.id}</div>
      <div class="case-industry">🏭 ${c.industry || ''} ${c.timeline ? '· ' + c.timeline : ''}</div>
      ${c.implementation ? `<p style="font-size:.8rem;color:var(--text-dim);margin-bottom:.4rem">${c.implementation}</p>` : ''}
      ${metrics.length ? `<div class="case-metrics">${metrics.slice(0,5).map(m => `<span class="metric-badge">${String(m).slice(0,40)}</span>`).join('')}</div>` : ''}
      ${lessons.length ? `<ul class="lesson-list">${lessons.slice(0,5).map(l => `<li>${l}</li>`).join('')}</ul>` : ''}
    </div>`;
  }).join('');
}

function renderPrompts(prompts) {
  if (!prompts.length) return '<div class="empty-msg">Brak promptów</div>';
  const limited = prompts.length > 30;
  const show = limited ? prompts.slice(0, 30) : prompts;
  let html = show.map(p => {
    const text = typeof p === 'string' ? p : (p.prompt || p.text || p.value || JSON.stringify(p));
    return `<div class="prompt-card">${text.slice(0, 300)}${text.length > 300 ? '…' : ''}</div>`;
  }).join('');
  if (limited) html += `<div class="empty-msg" style="margin-top:.5rem">… i jeszcze ${prompts.length - 30} promptów (łącznie ${prompts.length})</div>`;
  return html;
}

function renderGenericArray(items) {
  if (!items.length) return '<div class="empty-msg">Brak elementów</div>';
  // Show max 50 items
  const show = items.slice(0, 50);
  return show.map(item => {
    if (typeof item === 'string') {
      return `<div class="prompt-card">${item.slice(0, 300)}</div>`;
    }
    const title = item.title || item.name || item.id || item.company || item.tool || '—';
    const desc = item.description || item.content || item.excerpt || item.text || item.answer || '';
    const url = item.url || item.link || item.source || '';
    return `<div class="case-card">
      <div class="case-company" style="font-size:.9rem">${title}</div>
      ${desc ? `<p style="font-size:.78rem;color:var(--text-dim);margin-top:.3rem;line-height:1.55">${String(desc).slice(0,250)}${String(desc).length > 250 ? '…' : ''}</p>` : ''}
      ${url ? `<a href="${url}" target="_blank" rel="noopener noreferrer" style="font-size:.72rem;color:var(--accent);margin-top:.3rem;display:block">🔗 ${new URL(url).hostname}</a>` : ''}
    </div>`;
  }).join('') + (items.length > 50 ? `<div class="empty-msg">… i ${items.length - 50} więcej (łącznie ${items.length})</div>` : '');
}

function renderResearchIndex(topics) {
  return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.5rem">
    ${topics.map(t => `
      <div class="case-card" style="cursor:pointer" onclick="selectDatasetById('${t.id}')" title="Kliknij aby otworzyć">
        <div class="case-company" style="font-size:.85rem">${t.id}</div>

        <div class="case-metrics">
          ${t.queries ? `<span class="metric-badge">${t.queries} zapytań</span>` : ''}
          ${t.sources ? `<span class="metric-badge" style="background:rgba(167,139,250,0.1);border-color:rgba(167,139,250,0.2);color:var(--accent2)">${t.sources} źródeł</span>` : ''}
          ${t.has_summary ? `<span class="metric-badge" style="background:rgba(52,211,153,0.1);border-color:rgba(52,211,153,0.2);color:var(--success)">✓ summary</span>` : ''}

// ═══════════════════════════════════════════════════════
// TRANSLATION — MyMemory API (bezpłatne, 5000 zn/dzień)
// ═══════════════════════════════════════════════════════
async function translateChunk(text) {
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.slice(0, 500))}&langpair=en|pl`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('MyMemory HTTP ' + res.status);
  const data = await res.json();
  if (data.responseStatus !== 200) throw new Error(data.responseMessage || 'Błąd tłumaczenia');
  return data.responseData.translatedText;
}

async function translateTexts(texts, progressEl, fillEl) {
  const results = [];
  for (let i = 0; i < texts.length; i++) {
    if (fillEl) fillEl.style.width = `${Math.round((i / texts.length) * 100)}%`;
    try {
      const t = await translateChunk(texts[i]);
      results.push(t);
    } catch {
      results.push('[błąd tłumaczenia]');
    }
    await new Promise(r => setTimeout(r, 200)); // rate limit
  }
  if (fillEl) fillEl.style.width = '100%';
  return results;
}

async function translateSummary() {
  if (!currentData) return;
  const ds = DATASETS[currentIdx];
  const status = document.getElementById('trans-status');
  const output = document.getElementById('trans-output');
  const progress = document.getElementById('trans-progress');
  const fill = document.getElementById('trans-progress-fill');

  // Collect texts to translate
  const texts = [];
  if (currentData.summary && currentData.summary !== 'Summary generation failed') texts.push('Podsumowanie:\n' + currentData.summary);
  if (currentData.description) texts.push('Opis:\n' + currentData.description);
  if (currentData.title) texts.push('Tytuł:\n' + currentData.title);

  // For raw_searches, translate first few answers
  if (currentData.raw_searches) {
    for (const s of currentData.raw_searches.slice(0, 5)) {
      if (s.answer) texts.push(`Zapytanie: ${s.query}\nOdpowiedź: ${s.answer.slice(0, 450)}`);
    }
  }

  if (!texts.length) {
    output.textContent = 'Brak tekstu do przetłumaczenia w tym datasecie.';
    return;
  }

  progress.style.display = 'block';
  fill.style.width = '0%';
  status.innerHTML = '<span class="spinner"></span> Tłumaczę…';
  output.classList.remove('empty');

  try {
    const translated = await translateTexts(texts, progress, fill);
    const result = translated.join('\n\n───────────────\n\n');
    output.textContent = result;
    saveTranslation(ds.id, result);
    status.textContent = `✓ Przetłumaczono ${texts.length} fragmentów`;
  } catch (e) {
    status.textContent = '⚠️ Błąd: ' + e.message;
  } finally {
    progress.style.display = 'none';
  }
}

async function translateAllAnswers() {
  if (!currentData || !currentData.raw_searches) {
    translateSummary();
    return;
  }
  const ds = DATASETS[currentIdx];
  const status = document.getElementById('trans-status');
  const output = document.getElementById('trans-output');
  const progress = document.getElementById('trans-progress');
  const fill = document.getElementById('trans-progress-fill');

  const texts = currentData.raw_searches
    .filter(s => s.answer)
    .map(s => `[${s.query}]\n${s.answer.slice(0, 450)}`);

  if (!texts.length) { status.textContent = 'Brak odpowiedzi do tłumaczenia'; return; }

  progress.style.display = 'block';
  fill.style.width = '0%';
  status.innerHTML = `<span class="spinner"></span> Tłumaczę ${texts.length} odpowiedzi…`;
  output.classList.remove('empty');

  try {
    const translated = await translateTexts(texts, progress, fill);
    const result = translated.map((t, i) => `${i+1}. ${t}`).join('\n\n');
    output.textContent = result;
    saveTranslation(ds.id, result);
    status.textContent = `✓ Przetłumaczono ${texts.length} odpowiedzi`;
  } catch (e) {
    status.textContent = '⚠️ Błąd: ' + e.message;
  } finally {
    progress.style.display = 'none';
  }
}

function openGoogleTranslate() {
  if (!currentData) return;
  const text = (currentData.summary || '') + ' ' + (currentData.description || '') +
    (currentData.raw_searches ? currentData.raw_searches.slice(0,3).map(s => s.answer || '').join(' ') : '');
  const url = `https://translate.google.pl/?sl=en&tl=pl&text=${encodeURIComponent(text.slice(0, 3000))}`;
  window.open(url, '_blank', 'noopener,noreferrer');
}

function clearTranslation() {
  const ds = DATASETS[currentIdx];
  if (!ds) return;
  delete translationsStore[ds.id];
  translatedSet.delete(ds.id);
  localStorage.setItem('dv_translations', JSON.stringify(translationsStore));
  const output = document.getElementById('trans-output');
  output.classList.add('empty');
  output.textContent = 'Tłumaczenie usunięte.';
  document.getElementById('trans-status').textContent = 'Wyczyszczono';
  document.getElementById('stat-translated').textContent = translatedSet.size;
  renderSidebar(document.getElementById('sidebar-search').value);
}

function saveTranslation(id, text) {
  translationsStore[id] = text;
  translatedSet.add(id);
  localStorage.setItem('dv_translations', JSON.stringify(translationsStore));
  document.getElementById('stat-translated').textContent = translatedSet.size;
  renderSidebar(document.getElementById('sidebar-search').value);
  const saved = document.getElementById('trans-saved');
  if (saved) { saved.style.display = 'block'; setTimeout(() => saved.style.display = 'none', 2000); }
}

function saveNotes(val) {
  const ds = DATASETS[currentIdx];
  if (!ds) return;
  notesStore[ds.id] = val;
  localStorage.setItem('dv_notes', JSON.stringify(notesStore));
  const saved = document.getElementById('trans-saved');
  if (saved) { saved.style.display = 'block'; setTimeout(() => saved.style.display = 'none', 1500); }
}

// ═══════════════════════════════════════════════════════
// EXPORT AS STANDALONE HTML
// ═══════════════════════════════════════════════════════
function exportDatasetHTML() {
  const ds = DATASETS[currentIdx];
  if (!ds || !currentData) return;
  const translation = translationsStore[ds.id] || '';
  const notes = notesStore[ds.id] || '';
  const sources = currentSources;

  const html = `<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>${ds.icon} ${ds.name} — Raport PL</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #1e293b; line-height: 1.7; }
  h1 { color: #0f172a; border-bottom: 3px solid #00c9a7; padding-bottom: .5rem; }
  h2 { color: #1d4ed8; margin-top: 2rem; }
  .meta { color: #64748b; font-size: .85rem; margin: .5rem 0 1rem; }
  .tag { background: #e0f2fe; color: #0369a1; padding: .1rem .4rem; border-radius: 3px; font-size: .75rem; margin-right: .25rem; }
  .source-list { list-style: none; padding: 0; }
  .source-list li { padding: .35rem 0; border-bottom: 1px solid #f1f5f9; font-size: .85rem; }
  .source-list li a { color: #1d4ed8; }
  .translation-box { background: #f0fdf4; border-left: 4px solid #22c55e; padding: 1rem 1.2rem; border-radius: 0 .5rem .5rem 0; white-space: pre-wrap; font-size: .88rem; }
  .notes-box { background: #fefce8; border-left: 4px solid #eab308; padding: 1rem 1.2rem; border-radius: 0 .5rem .5rem 0; white-space: pre-wrap; font-size: .88rem; }
  .raw-content { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: .5rem; padding: 1rem; font-size: .82rem; white-space: pre-wrap; overflow: auto; max-height: 500px; }
  .footer { margin-top: 3rem; color: #94a3b8; font-size: .78rem; text-align: center; border-top: 1px solid #e2e8f0; padding-top: 1rem; }
</style>
</head>
<body>
<h1>${ds.icon} ${data.title || ds.name}</h1>
<div class="meta">
  Kategoria: <b>${ds.cat}</b> · Wygenerowano: ${data.generated || data.created || '—'}
  ${(data.tags||[]).map(t => `<span class="tag">${t}</span>`).join('')}
</div>
${data.description ? `<p>${data.description}</p>` : ''}
${data.summary && data.summary !== 'Summary generation failed' ? `<blockquote style="border-left:4px solid #00c9a7;padding:.5rem 1rem;margin:1rem 0;background:#f0fdfa"><p>${data.summary}</p></blockquote>` : ''}

<h2>🔗 Linki źródłowe wiedzy (${sources.length})</h2>
<ul class="source-list">
  ${sources.map(s => `<li>🌐 <a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.title}</a><br><small style="color:#94a3b8">${s.url}</small></li>`).join('')}
</ul>

${translation ? `<h2>🇵🇱 Tłumaczenie na język polski</h2>
<div class="translation-box">${translation}</div>` : ''}

${notes ? `<h2>📝 Notatki</h2>
<div class="notes-box">${notes}</div>` : ''}

<h2>📄 Surowe dane (JSON)</h2>
<pre class="raw-content">${JSON.stringify(currentData, null, 2).slice(0, 10000)}${JSON.stringify(currentData, null, 2).length > 10000 ? '\n…(skrócono do 10 000 znaków)' : ''}</pre>

<div class="footer">
  Dataset Viewer PL — JIMBO DevZ · Wygenerowano: ${new Date().toLocaleString('pl-PL')}
</div>
</body>
</html>`;

  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${ds.id}_PL_${new Date().toISOString().slice(0,10)}.html`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('✓ Plik HTML pobrany: ' + a.download);
}

// ═══════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════
function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  Object.assign(t.style, {
    position: 'fixed', bottom: '1.5rem', right: '1.5rem',
    background: 'rgba(0,255,204,0.15)',
    border: '1px solid rgba(0,255,204,0.4)',
    color: '#00ffcc',
    padding: '.6rem 1.2rem',
    borderRadius: '.5rem',
    fontSize: '.82rem',
    zIndex: '9999',
    backdropFilter: 'blur(8px)',
    transition: 'opacity .3s',
  });
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2500);
}

// ═══════════════════════════════════════════════════════
// KEYBOARD NAVIGATION
// ═══════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (currentIdx < DATASETS.length - 1) selectDataset(currentIdx + 1);
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    if (currentIdx > 0) selectDataset(currentIdx - 1);
  }
});

// ─── INIT ───
renderSidebar();
</script>
</body>
</html>
