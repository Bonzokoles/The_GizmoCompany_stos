<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIMBO Film Vault — Recenzje Filmowe</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
:root {
    --bg: #03040b;
    --glass-bg: rgba(15,23,42,0.45);
    --glass-border: rgba(255,255,255,0.08);
    --glass-glow: rgba(0,255,204,0.15);
    --accent: #00ffcc;
    --accent2: #a78bfa;
    --accent-dim: rgba(0,255,204,0.15);
    --danger: #f87171;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --text-dim: #64748b;
    --font: 'Inter', system-ui, sans-serif;
    --radius: 14px;
    --transition: 0.3s cubic-bezier(0.25,0.8,0.25,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;
  background:radial-gradient(ellipse at 30% -10%,#1a2238 0%,#03040b 55%);background-attachment:fixed;}
a{color:var(--accent);text-decoration:none}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:100;padding:1rem 2rem;display:flex;align-items:center;gap:1.5rem;
  background:rgba(3,4,11,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border)}
.topbar h1{font-size:1.4rem;font-weight:900;letter-spacing:1px;white-space:nowrap}
.topbar h1 span{color:var(--accent)}
.search-box{flex:1;max-width:500px;position:relative}
.search-box input{width:100%;padding:.7rem 1rem .7rem 2.5rem;background:rgba(255,255,255,0.06);border:1px solid var(--glass-border);
  border-radius:10px;color:var(--text);font-size:.95rem;font-family:var(--font);outline:none;transition:var(--transition)}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 20px var(--accent-dim)}
.search-box svg{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-muted)}
.stats{color:var(--text-muted);font-size:.85rem;white-space:nowrap}

/* FILTERS */
.filters{padding:.75rem 2rem;display:flex;gap:.5rem;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,0.03)}
.filter-btn{padding:.4rem .9rem;border-radius:20px;border:1px solid var(--glass-border);background:transparent;
  color:var(--text-muted);font-size:.8rem;font-family:var(--font);cursor:pointer;transition:var(--transition);white-space:nowrap}
.filter-btn:hover,.filter-btn.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(0,255,204,0.3)}

/* VIEWS */
.view-toggle{display:flex;gap:.3rem;margin-left:auto}
.view-btn{padding:.4rem .6rem;border-radius:8px;border:1px solid var(--glass-border);background:transparent;
  color:var(--text-muted);cursor:pointer;transition:var(--transition);display:flex;align-items:center}
.view-btn.active{background:var(--accent-dim);color:var(--accent)}
.view-btn svg{width:16px;height:16px}

/* MAIN LAYOUT */
.main{padding:2rem;max-width:1400px;margin:0 auto}

/* GRID VIEW */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem}

/* CARD */
.card{position:relative;background:var(--glass-bg);backdrop-filter:blur(14px);border:1px solid var(--glass-border);
  border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:var(--transition);display:flex;flex-direction:column}
.card:hover{transform:translateY(-6px);border-color:rgba(255,255,255,0.18);box-shadow:0 20px 40px rgba(0,0,0,0.4),0 0 20px var(--glass-glow)}
.card-poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#111}
.card-poster.no-img{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e293b);
  color:var(--text-dim);font-size:3rem;font-weight:900}
.card-body{padding:1rem 1.2rem 1.2rem;flex:1;display:flex;flex-direction:column}
.card-title{font-size:1.1rem;font-weight:700;margin-bottom:.3rem;line-height:1.3}
.card-meta{font-size:.8rem;color:var(--text-muted);margin-bottom:.5rem}
.card-tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:auto}
.card-tag{font-size:.7rem;padding:.15rem .5rem;border-radius:10px;background:rgba(167,139,250,0.12);color:var(--accent2);border:1px solid rgba(167,139,250,0.2)}
.card-rating{position:absolute;top:.75rem;right:.75rem;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);
  padding:.3rem .6rem;border-radius:8px;font-size:.8rem;font-weight:700;color:#fbbf24;border:1px solid rgba(251,191,36,0.2)}
.card-reviews-badge{position:absolute;top:.75rem;left:.75rem;background:rgba(0,255,204,0.15);backdrop-filter:blur(8px);
  padding:.25rem .5rem;border-radius:8px;font-size:.7rem;font-weight:600;color:var(--accent);border:1px solid rgba(0,255,204,0.2)}

/* LIST VIEW */
.list .card{flex-direction:row;height:120px}
.list .card-poster{width:80px;height:100%;aspect-ratio:unset}
.list .card-poster.no-img{font-size:1.5rem}
.list .card-body{justify-content:center}

/* MODAL */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.8);backdrop-filter:blur(6px);
  display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:2rem}
.modal-overlay.open{display:flex}
.modal{background:#0a0e1a;border:1px solid var(--glass-border);border-radius:18px;max-width:900px;width:100%;
  position:relative;animation:modalIn .4s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
.modal-close{position:absolute;top:1rem;right:1rem;z-index:10;width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,0.08);border:1px solid var(--glass-border);color:var(--text);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;transition:var(--transition)}
.modal-close:hover{background:rgba(248,113,113,0.2);border-color:var(--danger);color:var(--danger)}
.modal-hero{position:relative;height:300px;overflow:hidden;border-radius:18px 18px 0 0}
.modal-hero img{width:100%;height:100%;object-fit:cover}
.modal-hero .gradient{position:absolute;inset:0;background:linear-gradient(to top,#0a0e1a 0%,transparent 60%)}
.modal-hero-info{position:absolute;bottom:1.5rem;left:2rem;right:2rem;z-index:2}
.modal-hero-info h2{font-size:2rem;font-weight:900;text-shadow:0 2px 20px rgba(0,0,0,0.8)}
.modal-hero-info .meta{color:var(--text-muted);font-size:.9rem;margin-top:.3rem}
.modal-content{padding:2rem}
.modal-overview{color:#cbd5e1;line-height:1.7;margin-bottom:1.5rem;font-size:.95rem}
.modal-section{margin-bottom:2rem}
.modal-section h3{color:var(--accent);text-transform:uppercase;letter-spacing:3px;font-size:.85rem;font-weight:900;
  margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid rgba(0,255,204,0.15)}

/* REVIEW TABS */
.review-tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.2rem}
.review-tab{padding:.4rem .9rem;border-radius:8px;border:1px solid var(--glass-border);background:transparent;
  color:var(--text-muted);font-size:.8rem;font-family:var(--font);cursor:pointer;transition:var(--transition);font-weight:600}
.review-tab:hover,.review-tab.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(0,255,204,0.3)}
.review-text{background:var(--glass-bg);border:1px solid var(--glass-border);border-left:4px solid var(--accent);
  border-radius:12px;padding:1.5rem;font-size:.95rem;line-height:1.8;color:#e2e8f0;white-space:pre-wrap;
  max-height:500px;overflow-y:auto}
.review-text::-webkit-scrollbar{width:6px}
.review-text::-webkit-scrollbar-thumb{background:rgba(0,255,204,0.2);border-radius:3px}

/* PERSONAL REVIEW FORM */
.personal-review{margin-top:1rem}
.personal-review textarea{width:100%;min-height:120px;padding:1rem;background:rgba(255,255,255,0.04);
  border:1px solid var(--glass-border);border-radius:12px;color:var(--text);font-family:var(--font);
  font-size:.9rem;line-height:1.6;resize:vertical;outline:none;transition:var(--transition)}
.personal-review textarea:focus{border-color:var(--accent);box-shadow:0 0 15px var(--accent-dim)}
.btn{padding:.6rem 1.2rem;border-radius:10px;border:1px solid var(--accent);background:var(--accent-dim);
  color:var(--accent);font-family:var(--font);font-size:.85rem;font-weight:700;cursor:pointer;transition:var(--transition)}
.btn:hover{background:var(--accent);color:#000}
.btn-sm{padding:.4rem .8rem;font-size:.78rem}
.btn-danger{border-color:var(--danger);background:rgba(248,113,113,0.1);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#000}
.personal-actions{display:flex;gap:.5rem;margin-top:.5rem;justify-content:flex-end}

/* METADATA CHIPS */
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.chip{font-size:.75rem;padding:.25rem .6rem;border-radius:10px;border:1px solid var(--glass-border);color:var(--text-muted);background:rgba(255,255,255,0.03)}

/* EMPTY STATE */
.empty{text-align:center;padding:4rem 2rem;color:var(--text-dim)}
.empty svg{width:80px;height:80px;margin-bottom:1rem;opacity:.3}
.empty h3{font-size:1.5rem;margin-bottom:.5rem;color:var(--text-muted)}

/* ADD MOVIE FORM */
.add-form{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius);padding:1.5rem;margin-bottom:2rem;display:none}
.add-form.open{display:block}
.add-form h3{color:var(--accent);margin-bottom:1rem;font-size:1rem;text-transform:uppercase;letter-spacing:2px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.form-group{display:flex;flex-direction:column;gap:.3rem}
.form-group label{font-size:.8rem;color:var(--text-muted);font-weight:600}
.form-group input{padding:.6rem .8rem;background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);
  border-radius:8px;color:var(--text);font-family:var(--font);font-size:.9rem;outline:none;transition:var(--transition)}
.form-group input:focus{border-color:var(--accent)}

/* RESPONSIVE */
@media(max-width:768px){
  .topbar{flex-wrap:wrap;padding:.8rem 1rem}
  .search-box{max-width:100%;order:3;flex-basis:100%}
  .main{padding:1rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem}
  .modal-hero{height:200px}
  .modal-content{padding:1.2rem}
  .form-row{grid-template-columns:1fr}
  .filters{padding:.5rem 1rem}
}
    </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
    <h1>🎬 <span>JIMBO</span> Film Vault</h1>
    <div class="search-box">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" id="search" placeholder="Szukaj filmów po tytule, reżyserze, gatunku...">
    </div>
    <div class="stats" id="stats"></div>
    <button class="btn btn-sm" onclick="toggleAddForm()">+ Dodaj Film</button>
</div>

<!-- FILTERS -->
<div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">Wszystkie</button>
    <button class="filter-btn" data-filter="has-reviews">Z recenzjami</button>
    <button class="filter-btn" data-filter="has-personal">Osobiste</button>
    <div class="view-toggle">
        <button class="view-btn active" data-view="grid" title="Siatka">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        </button>
        <button class="view-btn" data-view="list" title="Lista">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
    </div>
</div>

<!-- ADD MOVIE FORM -->
<div class="main">
    <div class="add-form" id="addForm">
        <h3>Dodaj nowy film</h3>
        <div class="form-row">
            <div class="form-group"><label>Tytuł *</label><input id="f-title" required></div>
            <div class="form-group"><label>Reżyser</label><input id="f-director"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Rok</label><input id="f-year" type="number" min="1900" max="2030"></div>
            <div class="form-group"><label>Gatunek (po przecinku)</label><input id="f-genres" placeholder="np. drama, thriller"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>URL Plakatu</label><input id="f-poster" placeholder="https://..."></div>
            <div class="form-group"><label>Kategoria</label><input id="f-category" placeholder="np. dramat, sci-fi"></div>
        </div>
        <div class="personal-review">
            <textarea id="f-review" placeholder="Twoja recenzja (opcjonalnie)..." rows="4"></textarea>
        </div>
        <div class="personal-actions" style="margin-top:1rem">
            <button class="btn btn-danger btn-sm" onclick="toggleAddForm()">Anuluj</button>
            <button class="btn" onclick="addMovie()">Dodaj film</button>
        </div>
    </div>

    <!-- MOVIE GRID -->
    <div class="grid" id="movieGrid"></div>
    <div class="empty" id="emptyState" style="display:none">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"/></svg>
        <h3>Brak wyników</h3>
        <p>Spróbuj zmienić wyszukiwanie lub filtry</p>
    </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
    <div class="modal" id="modalContent"></div>
</div>

<script>
let DB = { movies: [], totalMovies: 0 };
let userMovies = [];
let currentFilter = 'all';
let currentView = 'grid';
let currentSearch = '';

// Load
async function init() {
    try {
        const res = await fetch('movies_db.json');
        DB = await res.json();
    } catch(e) {
        console.error('Nie udało się załadować bazy:', e);
        DB = { movies: [], totalMovies: 0 };
    }
    // Load user-added movies from localStorage
    try {
        userMovies = JSON.parse(localStorage.getItem('jimbo_user_movies') || '[]');
    } catch(e) { userMovies = []; }
    // Load personal reviews from localStorage
    try {
        const saved = JSON.parse(localStorage.getItem('jimbo_personal_reviews') || '{}');
        DB.movies.forEach(m => {
            if (saved[m.title]) m.reviews.personal = saved[m.title];
        });
    } catch(e) {}
    render();
}

function getAllMovies() {
    return [...DB.movies, ...userMovies];
}

function getFilteredMovies() {
    let movies = getAllMovies();
    // Search
    if (currentSearch) {
        const q = currentSearch.toLowerCase();
        movies = movies.filter(m => {
            const title = (m.title || '').toLowerCase();
            const dir = (m.metadata?.director || '').toLowerCase();
            const genres = (m.metadata?.genres || []).join(' ').toLowerCase();
            const cat = (m.metadata?.category || '').toLowerCase();
            const tags = (m.metadata?.tags || []).join(' ').toLowerCase();
            return title.includes(q) || dir.includes(q) || genres.includes(q) || cat.includes(q) || tags.includes(q);
        });
    }
    // Filter
    if (currentFilter === 'has-reviews') {
        movies = movies.filter(m => Object.keys(m.reviews?.styles || {}).length > 0);
    } else if (currentFilter === 'has-personal') {
        movies = movies.filter(m => m.reviews?.personal);
    }
    return movies;
}

function render() {
    const movies = getFilteredMovies();
    const grid = document.getElementById('movieGrid');
    const empty = document.getElementById('emptyState');
    const stats = document.getElementById('stats');

    const total = getAllMovies().length;
    const withReviews = getAllMovies().filter(m => Object.keys(m.reviews?.styles || {}).length > 0).length;
    stats.textContent = `${total} filmów · ${withReviews} z recenzjami · ${movies.length} widocznych`;

    grid.className = currentView === 'list' ? 'grid list' : 'grid';

    if (movies.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';

    grid.innerHTML = movies.map((m, i) => {
        const poster = m.metadata?.tmdb_poster;
        const rating = m.metadata?.vote_average || m.metadata?.tmdb_rating;
        const year = m.metadata?.year;
        const dir = m.metadata?.director;
        const hasStyles = Object.keys(m.reviews?.styles || {}).length > 0;
        const hasPersonal = !!m.reviews?.personal;
        const styleCount = Object.keys(m.reviews?.styles || {}).length;
        const tags = (m.metadata?.tags || []).slice(0, 3);

        let badgeHtml = '';
        if (hasStyles) badgeHtml = `<div class="card-reviews-badge">${styleCount} stylów</div>`;
        else if (hasPersonal) badgeHtml = `<div class="card-reviews-badge">osobista</div>`;

        let ratingHtml = rating ? `<div class="card-rating">★ ${Number(rating).toFixed(1)}</div>` : '';

        let posterHtml = poster
            ? `<img class="card-poster" src="${escHtml(poster)}" alt="${escHtml(m.title)}" loading="lazy" onerror="this.outerHTML='<div class=\\'card-poster no-img\\'>${escHtml(m.title[0])}</div>'">`
            : `<div class="card-poster no-img">${escHtml(m.title?.[0] || '?')}</div>`;

        let tagsHtml = tags.map(t => `<span class="card-tag">${escHtml(t)}</span>`).join('');

        return `<div class="card" onclick="openMovie(${i})" style="animation-delay:${Math.min(i * 0.04, 0.6)}s;opacity:0;animation:fadeIn .5s ease forwards ${Math.min(i * 0.04, 0.6)}s">
            ${badgeHtml}${ratingHtml}${posterHtml}
            <div class="card-body">
                <div class="card-title">${escHtml(m.title)}</div>
                <div class="card-meta">${year ? year : ''}${dir ? ' · ' + escHtml(dir) : ''}</div>
                <div class="card-tags">${tagsHtml}</div>
            </div>
        </div>`;
    }).join('');
}

function openMovie(idx) {
    const movies = getFilteredMovies();
    const m = movies[idx];
    if (!m) return;

    const poster = m.metadata?.tmdb_backdrop || m.metadata?.tmdb_poster;
    const rating = m.metadata?.vote_average || m.metadata?.tmdb_rating;
    const year = m.metadata?.year;
    const dir = m.metadata?.director;
    const runtime = m.metadata?.runtime;
    const genres = m.metadata?.genres || [];
    const cast = m.metadata?.cast || [];
    const overview = m.metadata?.overview;
    const styles = m.reviews?.styles || {};
    const personal = m.reviews?.personal;
    const styleNames = Object.keys(styles);

    let heroImg = poster ? `<img src="${escHtml(poster)}" alt="">` : '';

    let metaParts = [];
    if (year) metaParts.push(year);
    if (dir) metaParts.push(escHtml(dir));
    if (runtime) metaParts.push(runtime + ' min');
    if (rating) metaParts.push('★ ' + Number(rating).toFixed(1));

    let genresHtml = genres.length ? `<div class="chips">${genres.map(g => `<span class="chip">${escHtml(g)}</span>`).join('')}</div>` : '';
    let castHtml = cast.length ? `<div class="chips">${cast.slice(0, 8).map(c => `<span class="chip">${escHtml(c)}</span>`).join('')}</div>` : '';

    let overviewHtml = overview ? `<p class="modal-overview">${escHtml(overview)}</p>` : '';

    // Review tabs
    let tabsHtml = '';
    let reviewsHtml = '';
    if (styleNames.length > 0 || personal) {
        const allTabs = [...styleNames];
        if (personal) allTabs.push('osobista');
        tabsHtml = `<div class="review-tabs">${allTabs.map((t, i) =>
            `<button class="review-tab${i === 0 ? ' active' : ''}" onclick="switchTab(this,'${escHtml(t)}','${escHtml(m.title)}')">${escHtml(t.toUpperCase())}</button>`
        ).join('')}</div>`;

        const firstKey = allTabs[0];
        const firstText = firstKey === 'osobista' ? personal : styles[firstKey];
        reviewsHtml = `<div class="review-text" id="reviewText">${escHtml(firstText || '')}</div>`;
    }

    // Personal review section
    let personalSection = `
    <div class="modal-section">
        <h3>Twoja recenzja</h3>
        <div class="personal-review">
            <textarea id="personalInput" placeholder="Napisz swoją recenzję...">${escHtml(personal || '')}</textarea>
            <div class="personal-actions">
                ${personal ? `<button class="btn btn-danger btn-sm" onclick="deletePersonal('${escJs(m.title)}')">Usuń</button>` : ''}
                <button class="btn btn-sm" onclick="savePersonal('${escJs(m.title)}')">Zapisz</button>
            </div>
        </div>
    </div>`;

    document.getElementById('modalContent').innerHTML = `
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div class="modal-hero">
            ${heroImg}
            <div class="gradient"></div>
            <div class="modal-hero-info">
                <h2>${escHtml(m.title)}</h2>
                <div class="meta">${metaParts.join(' · ')}</div>
            </div>
        </div>
        <div class="modal-content">
            ${overviewHtml}
            ${genres.length ? `<div class="modal-section"><h3>Gatunki</h3>${genresHtml}</div>` : ''}
            ${cast.length ? `<div class="modal-section"><h3>Obsada</h3>${castHtml}</div>` : ''}
            ${(styleNames.length || personal) ? `<div class="modal-section"><h3>Recenzje</h3>${tabsHtml}${reviewsHtml}</div>` : ''}
            ${personalSection}
        </div>`;

    document.getElementById('modal').classList.add('open');
    document.body.style.overflow = 'hidden';
}

function switchTab(btn, key, title) {
    document.querySelectorAll('.review-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const movies = getAllMovies();
    const m = movies.find(x => x.title === title);
    if (!m) return;
    const text = key === 'osobista' ? m.reviews.personal : (m.reviews.styles?.[key] || '');
    document.getElementById('reviewText').textContent = text;
}

function closeModal() {
    document.getElementById('modal').classList.remove('open');
    document.body.style.overflow = '';
}

function savePersonal(title) {
    const text = document.getElementById('personalInput').value.trim();
    if (!text) return;
    const saved = JSON.parse(localStorage.getItem('jimbo_personal_reviews') || '{}');
    saved[title] = text;
    localStorage.setItem('jimbo_personal_reviews', JSON.stringify(saved));
    // Update in-memory
    const m = getAllMovies().find(x => x.title === title);
    if (m) m.reviews.personal = text;
    render();
    openMovieByTitle(title);
}

function deletePersonal(title) {
    const saved = JSON.parse(localStorage.getItem('jimbo_personal_reviews') || '{}');
    delete saved[title];
    localStorage.setItem('jimbo_personal_reviews', JSON.stringify(saved));
    const m = getAllMovies().find(x => x.title === title);
    if (m) m.reviews.personal = null;
    render();
    openMovieByTitle(title);
}

function openMovieByTitle(title) {
    const movies = getFilteredMovies();
    const idx = movies.findIndex(x => x.title === title);
    if (idx >= 0) openMovie(idx);
}

function toggleAddForm() {
    document.getElementById('addForm').classList.toggle('open');
}

function addMovie() {
    const title = document.getElementById('f-title').value.trim();
    if (!title) { alert('Tytuł jest wymagany!'); return; }
    const movie = {
        id: 'user-' + Date.now(),
        title,
        source: 'user',
        metadata: {
            director: document.getElementById('f-director').value.trim() || null,
            year: parseInt(document.getElementById('f-year').value) || null,
            genres: document.getElementById('f-genres').value.split(',').map(s => s.trim()).filter(Boolean),
            category: document.getElementById('f-category').value.trim() || null,
            tmdb_poster: document.getElementById('f-poster').value.trim() || null,
            tags: [], cast: [], keywords: [], runtime: null
        },
        reviews: { styles: {}, personal: null }
    };
    const review = document.getElementById('f-review').value.trim();
    if (review) {
        movie.reviews.personal = review;
        const saved = JSON.parse(localStorage.getItem('jimbo_personal_reviews') || '{}');
        saved[title] = review;
        localStorage.setItem('jimbo_personal_reviews', JSON.stringify(saved));
    }
    userMovies.push(movie);
    localStorage.setItem('jimbo_user_movies', JSON.stringify(userMovies));
    // Clear form
    ['f-title','f-director','f-year','f-genres','f-poster','f-category','f-review'].forEach(id => document.getElementById(id).value = '');
    toggleAddForm();
    render();
}

// Event listeners
document.getElementById('search').addEventListener('input', e => { currentSearch = e.target.value; render(); });

document.getElementById('filters').addEventListener('click', e => {
    if (e.target.classList.contains('filter-btn')) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        render();
    }
    if (e.target.closest('.view-btn')) {
        const btn = e.target.closest('.view-btn');
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentView = btn.dataset.view;
        render();
    }
});

document.getElementById('modal').addEventListener('click', e => {
    if (e.target === document.getElementById('modal')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// Utils
function escHtml(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }
function escJs(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"'); }

// Animations
const style = document.createElement('style');
style.textContent = '@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}';
document.head.appendChild(style);

init();
</script>

<button class="vchat-btn" id="vchatToggle" title="Asystent filmowy AI">
  <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.2L4 17.2V4h16v12z"/></svg>
</button>

<div class="vchat-win" id="vchatWin">
  <div class="vchat-hdr">
    <span class="vchat-hdr-dot"></span>
    <span class="vchat-hdr-title">Film Asystent AI <span class="vchat-hdr-sub">— polski / voice</span></span>
    <button class="vchat-close" id="vchatClose">&times;</button>
  </div>
  <div class="vchat-msgs" id="vchatMsgs">
    <div class="vchat-msg system">Cześć! Zapytaj o filmy, aktorów, rekomendacje — pisz lub naciśnij 🎤</div>
  </div>
  <div class="vchat-input">
    <input type="text" id="vchatText" placeholder="Zapytaj o film..." autocomplete="off">
    <button class="vchat-mic" id="vchatMic" title="Nagrywaj głos">🎤</button>
    <button class="vchat-send" id="vchatSend" title="Wyślij">➤</button>
  </div>
</div>

<script>
(function(){
  const toggle=document.getElementById('vchatToggle'),win=document.getElementById('vchatWin'),
    msgs=document.getElementById('vchatMsgs'),txt=document.getElementById('vchatText'),
    sendBtn=document.getElementById('vchatSend'),micBtn=document.getElementById('vchatMic'),
    closeBtn=document.getElementById('vchatClose');
  let history=[], mediaRec=null, audioChunks=[], recording=false, currentAudio=null;

  toggle.onclick=()=>{win.classList.toggle('open');toggle.classList.toggle('active');
    if(win.classList.contains('open'))txt.focus()};
  closeBtn.onclick=()=>{win.classList.remove('open');toggle.classList.remove('active')};
  txt.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}};
  sendBtn.onclick=()=>sendMsg();

  function addMsg(role,text){
    const d=document.createElement('div');d.className='vchat-msg '+(role==='user'?'user':'ai');
    if(role==='ai'){
      const span=document.createElement('span');span.textContent=text;d.appendChild(span);
      const ttsBtn=document.createElement('button');ttsBtn.className='vchat-tts';ttsBtn.textContent='🔊';
      ttsBtn.title='Odtwórz głosowo';ttsBtn.onclick=()=>playTTS(text,ttsBtn);d.appendChild(ttsBtn);
    } else {d.textContent=text}
    msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;
  }

  async function sendMsg(){
    const text=txt.value.trim();if(!text)return;txt.value='';
    addMsg('user',text);history.push({role:'user',content:text});
    const aiEl=addMsg('ai','...');
    try{
      const r=await fetch('/api/ai/chat',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({prompt:text,maxTokens:1024,systemPrompt:'Jesteś ekspertem filmowym i asystentem JIMBO Film Vault. Odpowiadaj po polsku. Pomagaj z rekomendacjami filmów, informacjami o aktorach, reżyserach i recenzjami. Bądź konkretny i entuzjastyczny.'})});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const data=await r.json();const reply=data.response||data.text||'(brak odpowiedzi)';
      aiEl.firstChild.textContent=reply;history.push({role:'assistant',content:reply});
    }catch(e){aiEl.firstChild.textContent='Błąd: '+e.message;aiEl.style.color='#f87171'}
    msgs.scrollTop=msgs.scrollHeight;
  }

  async function playTTS(text,btn){
    if(currentAudio){currentAudio.pause();currentAudio=null;
      document.querySelectorAll('.vchat-tts.playing').forEach(b=>b.classList.remove('playing'))}
    btn.classList.add('playing');btn.textContent='⏳';
    try{
      const r=await fetch('/api/ai/tts',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text,voice:'nova'})});
      if(!r.ok)throw new Error('TTS HTTP '+r.status);
      const blob=await r.blob();const url=URL.createObjectURL(blob);
      currentAudio=new Audio(url);
      currentAudio.onended=()=>{btn.classList.remove('playing');btn.textContent='🔊';URL.revokeObjectURL(url);currentAudio=null};
      currentAudio.onerror=()=>{btn.classList.remove('playing');btn.textContent='🔊';currentAudio=null};
      await currentAudio.play();
    }catch(e){btn.classList.remove('playing');btn.textContent='🔊';console.error('TTS error:',e)}
  }

  micBtn.onclick=async()=>{
    if(recording){stopRecording();return}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert('Przeglądarka nie obsługuje nagrywania.');return}
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:{sampleRate:16000,channelCount:1}});
      audioChunks=[];
      mediaRec=new MediaRecorder(stream,{mimeType:MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm'});
      mediaRec.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data)};
      mediaRec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());await processAudio()};
      mediaRec.start();recording=true;micBtn.classList.add('recording');micBtn.textContent='⏹';
    }catch(e){alert('Brak dostępu do mikrofonu: '+e.message)}
  };

  function stopRecording(){
    if(mediaRec&&mediaRec.state!=='inactive'){mediaRec.stop();recording=false;
      micBtn.classList.remove('recording');micBtn.textContent='🎤'}
  }

  async function processAudio(){
    const blob=new Blob(audioChunks,{type:'audio/webm'});
    if(blob.size<500){return}
    micBtn.textContent='⏳';
    try{
      const buf=await blob.arrayBuffer();const b64=btoa(String.fromCharCode(...new Uint8Array(buf)));
      const r=await fetch('/api/ai/stt',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({audio:b64})});
      if(!r.ok)throw new Error('STT HTTP '+r.status);
      const data=await r.json();
      if(data.text&&data.text.trim()){txt.value=data.text.trim();sendMsg()}
      else{const s=document.createElement('div');s.className='vchat-msg system';s.textContent='Nie rozpoznano mowy.';msgs.appendChild(s)}
    }catch(e){const s=document.createElement('div');s.className='vchat-msg system';s.textContent='Błąd STT: '+e.message;msgs.appendChild(s)}
    micBtn.textContent='🎤';msgs.scrollTop=msgs.scrollHeight;
  }
})();
</script>
