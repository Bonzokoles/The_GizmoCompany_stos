name: Deploy Web to Cloudflare Pages

on:
    push:
        branches: [main]
        paths:
            - "src/**"
            - "public/**"
            - "movies-app/**"
            - "ai-hub/**"
            - "functions/**"
            - "index.html"
            - "vite.config.ts"
            - "wrangler.toml"
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        name: Deploy to Cloudflare Pages

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"
                  cache: "npm"

            - name: Install system dependencies
              run: |
                  sudo apt-get update -y
                  sudo apt-get install -y python3 make g++ build-essential

            - name: Install dependencies
              run: npm ci
              env:
                  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

            - name: Build Vite app
              run: npm run build:vite

            - name: Copy movies-app to dist
              run: cp -r movies-app dist/movies-app

            - name: Copy ai-hub to dist
              run: cp -r ai-hub dist/ai-hub

            - name: Deploy to Cloudflare Pages
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy dist --project-name=zeno-browser-web --commit-dirty=true
